<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdoms Purists Deck Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
        <h1>Kingdoms Purists Deck Builder</h1>
        <main>
        <div class="container">
            <div class="search-section">
                <div id="filters" style="margin-bottom:0.5rem;">
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:0.5rem; align-items:end;">
                        <label style="display:flex; flex-direction:column; gap:4px;">
                            <span>Category</span>
                            <select id="f-category">
                                <option value="all" selected>All</option>
                                <option value="Monster">Monster</option>
                                <option value="Spell">Spell</option>
                                <option value="Trap">Trap</option>
                            </select>
                        </label>
                        <label style="display:flex; flex-direction:column; gap:4px;">
                            <span>Attribute</span>
                            <select id="f-attribute"><option value="all" selected>All</option></select>
                        </label>
                        <label style="display:flex; flex-direction:column; gap:4px;">
                            <span>Card Type</span>
                            <select id="f-type"><option value="all" selected>All</option></select>
                        </label>
                        <label style="display:flex; flex-direction:column; gap:4px;">
                            <span>Type</span>
                            <select id="f-race"><option value="all" selected>All</option></select>
                        </label>
                        <div id="monster-tags">
                            <label><input type="checkbox" class="f-monster-tag" id="f-tag-pendulum" value="Pendulum" disabled><span>Pendulum</span></label>
                            <label><input type="checkbox" class="f-monster-tag" id="f-tag-tuner" value="Tuner" disabled><span>Tuner</span></label>
                            <label><input type="checkbox" class="f-monster-tag" id="f-tag-flip" value="Flip" disabled><span>Flip</span></label>
                            <label><input type="checkbox" class="f-monster-tag" id="f-tag-spirit" value="Spirit" disabled><span>Spirit</span></label>
                            <label><input type="checkbox" class="f-monster-tag" id="f-tag-gemini" value="Gemini" disabled><span>Gemini</span></label>
                            <label><input type="checkbox" class="f-monster-tag" id="f-tag-union" value="Union" disabled><span>Union</span></label>
                        </div>
                        <div id="monster-numerics">
                            <label style="display:flex; flex-direction:column; gap:4px;"><span>Lv/Rank</span><input id="f-level" type="text" placeholder=">=4, <8, 7, etc."></label>
                            <label style="display:flex; flex-direction:column; gap:4px;"><span>Scale</span><input id="f-scale" type="number" min="0" placeholder="any"></label>
                            <label style="display:flex; flex-direction:column; gap:4px;"><span>ATK</span><input id="f-atk" type="text" placeholder=">2000, <=1500, 0, etc."></label>
                            <label style="display:flex; flex-direction:column; gap:4px;"><span>DEF</span><input id="f-def" type="text" placeholder=">=2000, <1000, ?, etc."></label>
                        </div>
                    </div>
                </div>
                <div style="display:flex; gap:0.5rem; align-items:center;">
                    <input type="text" id="search-bar" placeholder="Search for a card..." style="flex:1 1 auto;">
                    <button id="search-button" type="button">Search</button>
                </div>
                <div id="search-tools" style="margin:0.5rem 0; display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;"></div>
                <div id="banlist-info" style="margin:0.5rem 0;">
                    <span id="banlist-status" class="muted">Using workspace Purist.lflist.conf</span>
                </div>
                <div id="search-pagination" style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;">
                    <button id="page-prev" type="button">Prev</button>
                    <div id="page-info" style="min-width:160px; text-align:center">Page 1 of 1</div>
                    <button id="page-next" type="button">Next</button>
                </div>
                <div id="search-results"></div>
            </div>
            <div class="list-section">
                <div class="list-header">
                    <h2>Deck</h2>
                    <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
                        <button id="clear-deck">Clear Deck</button>
                        <button id="export-ydk">Download .ydk</button>
                        <button id="copy-ydke">Copy YDKE</button>
                        <button id="theme-toggle" class="theme-toggle" type="button">Dark Mode</button>
                        <span id="import-status" class="muted"></span>
                        <div id="legalityMessage" class="muted" style="margin-left:0.5rem"></div>
                    </div>
                </div>
                <div class="deck-row">
                    <div id="deck-sections" class="deck-area-limited">
                        <div class="deck-zone">
                            <div class="deck-zone-header">Main Deck <span id="main-count" class="muted">(0/60)</span></div>
                            <div id="main-deck" class="deck-grid"></div>
                        </div>
                        <div class="deck-zone">
                            <div class="deck-zone-header">Extra Deck <span id="extra-count" class="muted">(0/15)</span></div>
                            <div id="extra-deck" class="deck-grid"></div>
                        </div>
                        <div class="deck-zone">
                            <div class="deck-zone-header">Side Deck <span id="side-count" class="muted">(0/15)</span></div>
                            <div id="side-deck" class="deck-grid"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- preview panel placed as the right column inside the main container -->
            <aside id="card-preview-panel" class="right-preview">
                <div class="preview-inner">
                    <div id="preview-image-wrap" class="preview-image-wrap">
                        <img id="preview-image" src="" alt="" class="preview-img" style="display:none;">
                    </div>
                    <div id="preview-info" class="preview-info" style="display:none;">
                        <h3 id="preview-name" class="preview-name"></h3>
                        <div id="preview-typeline" class="muted preview-typeline"></div>
                        <div id="preview-stats" class="muted preview-stats"></div>
                        <div id="preview-desc" class="preview-desc"></div>
                    </div>
                    <div id="preview-empty" class="muted preview-empty">Select a card from the results or a slot to preview its full image and description.</div>
                </div>
            </aside>
        </div> <!-- .container -->
        </main>
    <script src="purist-banlist.js"></script>
    <script src="script.js"></script>
</body>
</html>
