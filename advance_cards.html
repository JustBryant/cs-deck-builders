<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Advance Cards — Kingdoms Purists</title>
  <link rel="stylesheet" href="deck-builder.css">
  <style>
    body{padding:18px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    /* responsive grid with comfortable spacing */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
    /* make each tile a flexible box so images center and never crop */
    .card-tile{background:rgba(255,255,255,0.02);border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center;overflow:visible;cursor:default}
    .card-tile img{width:100%;height:auto;object-fit:contain;border-radius:6px;display:block}
    /* remove name captions (visual-only page) */
    .card-name{display:none}
    .preview{position:fixed;pointer-events:none;z-index:9999;display:none;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
    .controls{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .search{flex:1;padding:8px;border-radius:6px}
  </style>
</head>
<body>
  <header>
    <div style="font-size:1.1rem;font-weight:700">Advance Cards</div>
    <div><a class="btn" href="index.html">← Back</a></div>
  </header>

  <section class="controls">
    <input id="search" class="search" placeholder="Search cards by name" />
    <select id="sort">
      <option value="name_asc">Name ↑</option>
      <option value="name_desc">Name ↓</option>
      <option value="type_name">Type, Name</option>
    </select>
  </section>

    <section style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div>
      <label>Per page: <select id="page-size"><option>16</option><option>32</option><option selected>48</option><option>64</option><option>80</option></select></label>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn" id="page-prev">Prev</button>
      <div id="page-status" style="min-width:140px;text-align:center;color:var(--muted)">Page 1 / 1</div>
      <button class="btn" id="page-next">Next</button>
    </div>
  </section>

  <section id="grid-root" class="grid"></section>

  <div id="preview" class="preview"><img id="preview-img" src="" style="display:block;max-width:420px;max-height:560px;border-radius:8px"></div>

  <script src="advance_cards.js"></script>
</body>
</html>
